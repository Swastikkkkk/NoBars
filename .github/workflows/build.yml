name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Unit tests (packets, routing, encryption, signatures)
        run: swift test

      - name: Relay simulation (multi-hop, dedup, TTL)
        if: hashFiles('Tests/RelaySimulation/main.swift') != ''
        run: |
          xcrun swiftc -O NoBars/Models/MeshRelayPacket.swift Tests/RelaySimulation/main.swift -o relay-sim
          ./relay-sim

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package unsigned IPA (for Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/NoBars.app Payload/
          zip -qry NoBars-unsigned.ipa Payload
          ls -lh NoBars-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NoBars-unsigned-ipa
          path: NoBars-unsigned.ipa


      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  simulator-mesh:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
      - name: Two-simulator mesh test
        timeout-minutes: 30
        run: |
          bash Tests/sim-mesh-test.sh dd/Build/Products/Debug-iphonesimulator/NoBars.app sim-out
          grep -q "ALL MESH CHECKS PASSED" sim-out/RESULT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-mesh
          path: sim-out

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
      - name: Capture screenshots
        timeout-minutes: 25
        run: bash Tests/screenshots.sh dd/Build/Products/Debug-iphonesimulator/NoBars.app shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests (same vectors as iOS)
        run: ./gradlew :core:test --no-daemon
      - name: Build APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: cp app/build/outputs/apk/release/app-release.apk NoBars.apk
      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build.gradle.kts') != ''
        with:
          name: NoBars-android-apk
          path: android/NoBars.apk

  # Publishes a GitHub release when VERSION on main names a version that has
  # no tag yet. Bump VERSION to ship.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, simulator-mesh, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          V="v$(tr -d ' \n' < VERSION)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: "NoBars-*" }
      - if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NoBars ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body_path: RELEASE_NOTES.md
