name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Unit tests (packets, routing, encryption, signatures)
        run: swift test

      - name: Relay simulation (multi-hop, dedup, TTL)
        if: hashFiles('Tests/RelaySimulation/main.swift') != ''
        run: |
          xcrun swiftc -O NoBars/Models/MeshRelayPacket.swift Tests/RelaySimulation/main.swift -o relay-sim
          ./relay-sim

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package unsigned IPA (for Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
          mkdir -p Payload && cp -R dd/Build/Products/Release-iphoneos/NoBars.app Payload/
          zip -qry NoBars-unsigned.ipa Payload
          ls -lh NoBars-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NoBars-unsigned-ipa
          path: NoBars-unsigned.ipa

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NoBars-unsigned.ipa
          generate_release_notes: true
          body: |
            Unsigned build for sideloading. Install `NoBars-unsigned.ipa` with Sideloadly or AltStore (see the README). You need two iPhones on iOS 26+.

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  simulator-mesh:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
      - name: Two-simulator mesh test
        timeout-minutes: 30
        run: |
          bash Tests/sim-mesh-test.sh dd/Build/Products/Debug-iphonesimulator/NoBars.app sim-out
          grep -q "ALL MESH CHECKS PASSED" sim-out/RESULT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-mesh
          path: sim-out

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild -project NoBars.xcodeproj -scheme NoBars -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -1
      - name: Capture screenshots
        timeout-minutes: 25
        run: bash Tests/screenshots.sh dd/Build/Products/Debug-iphonesimulator/NoBars.app shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
